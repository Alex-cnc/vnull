name: DoyahStudio
options:
  bundleIdPrefix: com.vnull
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  postGenCommand: ./Scripts/patch-xcodeproj.sh

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-sandbox"

packages:
  PostgresNIO:
    path: Vendor/postgres-nio

targets:
  DoyahCore:
    type: framework
    platform: macOS
    sources:
      - path: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.doyah.DoyahCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    dependencies:
      - sdk: Security.framework
      - package: PostgresNIO
        product: PostgresNIO

  DoyahStudio:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "DoyahStudio.entitlements"
    dependencies:
      - target: DoyahCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.doyah.DoyahStudio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Doyah Studio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_ENTITLEMENTS: App/DoyahStudio.entitlements
        ENABLE_HARDENED_RUNTIME: YES

  DoyahStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DoyahCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.doyah.DoyahStudioTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DoyahCore:
    build:
      targets:
        DoyahCore: all
        DoyahStudioTests: [test]
    test:
      config: Debug
      targets:
        - DoyahStudioTests
  DoyahStudio:
    build:
      targets:
        DoyahStudio: all
    run:
      config: Debug
