name: PostgresClient
options:
  bundleIdPrefix: com.vnull
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  postGenCommand: ./Scripts/patch-xcodeproj.sh

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-sandbox"

packages:
  PostgresNIO:
    path: Vendor/postgres-nio

targets:
  PostgresClientCore:
    type: framework
    platform: macOS
    sources:
      - path: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vnull.PostgresClientCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    dependencies:
      - sdk: Security.framework
      - package: PostgresNIO
        product: PostgresNIO

  PostgresClient:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "PostgresClient.entitlements"
    dependencies:
      - target: PostgresClientCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vnull.PostgresClient
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PostgresClient
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_ENTITLEMENTS: App/PostgresClient.entitlements
        ENABLE_HARDENED_RUNTIME: YES

  PostgresClientTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: PostgresClientCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vnull.PostgresClientTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PostgresClientCore:
    build:
      targets:
        PostgresClientCore: all
        PostgresClientTests: [test]
    test:
      config: Debug
      targets:
        - PostgresClientTests
  PostgresClient:
    build:
      targets:
        PostgresClient: all
    run:
      config: Debug
