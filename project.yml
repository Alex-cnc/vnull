name: DoyahStudio
options:
  bundleIdPrefix: com.vnull
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  postGenCommand: ./Scripts/patch-xcodeproj.sh

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -disable-sandbox"

packages:
  PostgresNIO:
    path: Vendor/postgres-nio

targets:
  DoyahCore:
    type: framework
    platform: macOS
    sources:
      - path: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.doyah.DoyahCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    dependencies:
      # Core 依赖 PostgresNIO（跨平台），但**不依赖 Security.framework** ——
      # 系统凭据存储的实现在 DoyahPlatform 里。
      - package: PostgresNIO
        product: PostgresNIO

  DoyahPlatform:
    type: framework
    platform: macOS
    sources:
      - path: Platform/macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.doyah.DoyahPlatform
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
    dependencies:
      - target: DoyahCore
      - sdk: Security.framework

  DoyahStudio:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "DoyahStudio.entitlements"
          # 原画与中间产物只用于重新生成图标，不打进 .app
          - "Resources/AppIcon-source.png"
          - "Resources/AppIcon-1024.png"
    dependencies:
      - target: DoyahCore
      - target: DoyahPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.doyah.DoyahStudio
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Doyah Studio
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_ENTITLEMENTS: App/DoyahStudio.entitlements
        ENABLE_HARDENED_RUNTIME: YES

  DoyahStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: DoyahCore
      - target: DoyahPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.doyah.DoyahStudioTests
        GENERATE_INFOPLIST_FILE: YES

  DoyahPlatformTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TestsPlatform
    dependencies:
      - target: DoyahCore
      - target: DoyahPlatform
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.doyah.DoyahPlatformTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DoyahCore:
    build:
      targets:
        DoyahCore: all
        DoyahPlatform: all
        DoyahStudioTests: [test]
        DoyahPlatformTests: [test]
    test:
      config: Debug
      targets:
        - DoyahStudioTests
        - DoyahPlatformTests
  DoyahStudio:
    build:
      targets:
        DoyahStudio: all
    run:
      config: Debug
